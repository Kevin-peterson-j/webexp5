<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2: BMI Calculator</title>
</head>
<body>

  <h1>Calculate your Body Mass Index (BMI)!</h1>
  <fieldset>
    Weight (in kilograms): <input type="text" id="weight" /><br /><br />
    Height (in meters): <input type="text" id="height" /><br /><br />
    <button onclick="calculate();">Get BMI!</button>
  </fieldset>

  <p>
    Your BMI is <span id="score" style="font-weight: bold;"></span>. <br />
    Your body type is <span id="type" style="font-weight: bold;"></span>.
  </p>

  <script>
    function calculate() {
      var weight = parseFloat(document.getElementById("weight").value);
      var height = parseFloat(document.getElementById("height").value);

      if (isNaN(weight) || isNaN(height) || height <= 0) {
        alert("Please enter valid positive numbers for weight and height.");
        return;
      }

      var bmi = weight / (height * height);
      var bodyType = "";

      if (bmi < 18) {
        bodyType = "Underweight";
      } else if (bmi >= 18 && bmi <= 25) {
        bodyType = "Normal";
      } else if (bmi > 25 && bmi <= 30) {
        bodyType = "Overweight";
      } else {
        bodyType = "Obese";
      }

      // Display score rounded to 2 decimal places and the body type
      document.getElementById("score").innerHTML = bmi.toFixed(2);
      document.getElementById("type").innerHTML = bodyType;
    }
  </script>
</body>
</html>
